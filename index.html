<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deriv Digit Predictor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============ THEME ============ */
        :root {
            --bg-glass: rgba(10, 14, 26, 0.78);
            --bg-glass-hover: rgba(10, 14, 26, 0.88);
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-glass: 0 8px 40px rgba(0, 0, 0, 0.6);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --predict-btn-bg: linear-gradient(135deg, #6c3cb0, #e94560);
            --predict-btn-text: #ffffff;
            --status-bg: rgba(255, 255, 255, 0.06);
            --freq-bar-bg: rgba(255, 255, 255, 0.06);
            --freq-fill: linear-gradient(180deg, #e94560, #6c3cb0);
            --freq-fill-high: linear-gradient(180deg, #22d3ee, #3b82f6);
            --history-digit-bg: rgba(255, 255, 255, 0.06);
            --history-digit-color: rgba(255, 255, 255, 0.5);
            --history-recent-bg: rgba(34, 211, 238, 0.12);
            --history-recent-color: #22d3ee;
            --history-highlight-bg: rgba(233, 69, 96, 0.15);
            --history-highlight-color: #e94560;
            --bg-input: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.08);
            --select-color: #ffffff;
            --select-bg: rgba(255, 255, 255, 0.06);
            --log-bg: rgba(0, 0, 0, 0.3);
            --log-text: rgba(255, 255, 255, 0.4);
            --result-bg: rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background-image: url('https://i.imgur.com/XpxjmIW.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: var(--shadow-glass);
            position: relative;
            z-index: 1;
            border: 1px solid var(--border-glass);
            transition: all 0.3s ease;
        }

        .container:hover {
            background: var(--bg-glass-hover);
            box-shadow: 0 12px 56px rgba(0, 0, 0, 0.7);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6c3cb0, #e94560);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #fff;
        }

        .logo-text {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .logo-text span {
            background: linear-gradient(135deg, #e94560, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(34, 211, 238, 0.12);
            color: #22d3ee;
            font-size: 9px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(34, 211, 238, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--status-bg);
            border-radius: 10px;
            margin-bottom: 14px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .dot.online {
            background: #22d3ee;
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
        }
        .dot.offline {
            background: #e94560;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.4);
        }
        .dot.connecting {
            background: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.85);
            }
        }

        .stats-mini {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: var(--text-secondary);
        }

        .stats-mini span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .selector-wrapper {
            margin-bottom: 12px;
        }

        .selector-wrapper label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: var(--select-bg);
            color: var(--select-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-height: 300px;
        }

        select option {
            background: #1a1a2e;
            color: #fff;
            padding: 4px 8px;
        }

        select optgroup {
            background: #0a0e1a;
            color: #22d3ee;
            font-weight: 700;
            padding: 4px 0;
        }

        select:hover {
            border-color: rgba(108, 60, 176, 0.4);
        }
        select:focus {
            outline: none;
            border-color: #6c3cb0;
            box-shadow: 0 0 20px rgba(108, 60, 176, 0.15);
        }

        .price-section {
            text-align: center;
            padding: 10px 0 8px;
        }

        .price-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .price-value {
            font-size: 38px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }

        .price-value .decimal {
            color: #22d3ee;
        }

        .predict-center {
            text-align: center;
            margin: 16px 0 18px;
        }

        .predict-btn {
            padding: 18px 50px;
            border: none;
            border-radius: 16px;
            background: var(--predict-btn-bg);
            color: var(--predict-btn-text);
            font-size: 22px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(108, 60, 176, 0.25);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .predict-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #6c3cb0, #e94560, #22d3ee, #6c3cb0);
            background-size: 300% 300%;
            border-radius: 18px;
            z-index: -1;
            animation: btnGlow 4s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .predict-btn:hover::before {
            opacity: 1;
        }

        .predict-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 40px rgba(108, 60, 176, 0.35);
        }

        .predict-btn:active {
            transform: scale(0.97);
        }

        .predict-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .predict-btn .sub {
            display: block;
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            text-transform: none;
            letter-spacing: 0;
            margin-top: 2px;
        }

        @keyframes btnGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 16px;
            margin: 8px 0;
        }

        .loading-spinner.active {
            display: block;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 8px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .loading-timer {
            color: #22d3ee;
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
        }

        .countdown-container {
            margin: 12px 0 14px;
            padding: 10px 14px;
            background: var(--result-bg);
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
        }

        .countdown-container.active {
            display: block;
        }

        .countdown-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .countdown-label .time-left {
            color: #22d3ee;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .countdown-label .time-left.warning {
            color: #f59e0b;
        }

        .countdown-label .time-left.danger {
            color: #e94560;
            animation: pulseText 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulseText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }

        .countdown-bar-track {
            width: 100%;
            height: 6px;
            background: var(--freq-bar-bg);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .countdown-bar-fill {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            transition: width 0.3s ease, background 0.5s ease;
            background: linear-gradient(90deg, #22d3ee, #10b981);
        }

        .countdown-bar-fill.glow-green {
            background: linear-gradient(90deg, #10b981, #22d3ee);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .countdown-bar-fill.glow-yellow {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .countdown-bar-fill.glow-orange {
            background: linear-gradient(90deg, #f97316, #fb923c);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.25);
        }

        .countdown-bar-fill.glow-red {
            background: linear-gradient(90deg, #dc2626, #e94560);
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.35);
            animation: pulseBar 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulseBar {
            0% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
            }
        }

        .result-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 0 0 10px;
            padding: 14px;
            background: var(--result-bg);
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .result-item {
            text-align: center;
        }

        .result-item .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .result-item .value {
            font-size: 30px;
            font-weight: 800;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s ease;
        }

        .result-item .value.predicted {
            color: #e94560;
            text-shadow: 0 0 25px rgba(233, 69, 96, 0.12);
            font-size: 44px;
        }

        .result-item .value.confidence {
            font-size: 22px;
            color: #10b981;
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.1);
        }

        .result-item .value.status-text {
            font-size: 18px;
            color: #f59e0b;
        }

        .result-status {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            padding: 6px;
            border-radius: 10px;
            margin-top: 2px;
            border: 1px solid transparent;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .result-status.waiting {
            color: var(--text-secondary);
            background: var(--bg-input);
            border-color: var(--border-color);
        }

        .result-status.loading {
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.15);
        }

        .result-status.expired {
            color: #e94560;
            background: rgba(233, 69, 96, 0.08);
            border-color: rgba(233, 69, 96, 0.2);
            animation: pulseText 0.5s ease-in-out infinite alternate;
        }

        .result-status.active {
            color: #22d3ee;
            background: rgba(34, 211, 238, 0.08);
            border-color: rgba(34, 211, 238, 0.15);
        }

        .result-status.correct {
            color: #22d3ee;
            background: rgba(34, 211, 238, 0.08);
            border-color: rgba(34, 211, 238, 0.15);
        }

        .result-status.wrong {
            color: #e94560;
            background: rgba(233, 69, 96, 0.08);
            border-color: rgba(233, 69, 96, 0.15);
        }

        .history-section {
            background: var(--bg-glass);
            border-radius: 12px;
            padding: 10px 14px;
            margin: 10px 0;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .history-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .history-digits {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .history-digit {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            background: var(--history-digit-bg);
            color: var(--history-digit-color);
            transition: all 0.3s ease;
            font-variant-numeric: tabular-nums;
        }

        .history-digit.recent {
            background: var(--history-recent-bg);
            color: var(--history-recent-color);
        }

        .history-digit.highlight {
            background: var(--history-highlight-bg);
            color: var(--history-highlight-color);
        }

        .frequency-section {
            margin: 10px 0 12px;
        }

        .frequency-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .frequency-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
        }

        .freq-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .freq-bar {
            width: 100%;
            height: 28px;
            background: var(--freq-bar-bg);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .freq-bar .fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 3px;
            transition: height 0.5s ease;
            background: var(--freq-fill);
        }

        .freq-bar .fill.high {
            background: var(--freq-fill-high);
        }

        .freq-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .log-section {
            margin-top: 10px;
            padding: 6px 10px;
            background: var(--log-bg);
            border-radius: 10px;
            max-height: 50px;
            overflow-y: auto;
            font-size: 10px;
            font-family: 'Inter', monospace;
            color: var(--log-text);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .log-section::-webkit-scrollbar {
            width: 3px;
        }
        .log-section::-webkit-scrollbar-thumb {
            background: rgba(108, 60, 176, 0.3);
            border-radius: 10px;
        }

        .log-entry {
            padding: 1px 0;
            color: var(--log-text);
        }
        .log-entry.success {
            color: #22d3ee;
        }
        .log-entry.error {
            color: #e94560;
        }
        .log-entry.info {
            color: #f59e0b;
        }

        @media (max-width: 420px) {
            .container {
                padding: 16px 12px;
            }
            .price-value {
                font-size: 30px;
            }
            .predict-btn {
                padding: 14px 30px;
                font-size: 18px;
            }
            .result-item .value.predicted {
                font-size: 34px;
            }
            .result-item .value {
                font-size: 24px;
            }
            .result-item .value.confidence {
                font-size: 18px;
            }
            .freq-bar {
                height: 22px;
            }
            .result-section {
                padding: 10px;
                gap: 6px;
            }
            select {
                font-size: 12px;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="logo">
                <div class="logo-icon">🎯</div>
                <div class="logo-text">Deriv<span>Predict</span></div>
            </div>
            <div class="badge">Live</div>
        </div>

        <div class="status-bar">
            <div class="status-dot">
                <span class="dot online" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="stats-mini">
                <span>⏱ <span id="tickCount">0</span></span>
                <span>🎯 <span id="accDisplay">0%</span></span>
            </div>
        </div>

        <div class="selector-wrapper">
            <label>📊 Select Index</label>
            <select id="symbol">
                <optgroup label="⚡ 1-Second Volatility Indices">
                    <option value="1HZ10V">Volatility 10 (1s)</option>
                    <option value="1HZ15V">Volatility 15 (1s)</option>
                    <option value="1HZ25V">Volatility 25 (1s)</option>
                    <option value="1HZ30V">Volatility 30 (1s)</option>
                    <option value="1HZ50V">Volatility 50 (1s)</option>
                    <option value="1HZ75V">Volatility 75 (1s)</option>
                    <option value="1HZ90V">Volatility 90 (1s)</option>
                    <option value="1HZ100V" selected>Volatility 100 (1s)</option>
                    <option value="1HZ150V">Volatility 150 (1s)</option>
                    <option value="1HZ200V">Volatility 200 (1s)</option>
                    <option value="1HZ250V">Volatility 250 (1s)</option>
                    <option value="1HZ300V">Volatility 300 (1s)</option>
                </optgroup>
                <optgroup label="📊 Standard Volatility (2s)">
                    <option value="R_10">Volatility 10</option>
                    <option value="R_25">Volatility 25</option>
                    <option value="R_50">Volatility 50</option>
                    <option value="R_75">Volatility 75</option>
                    <option value="R_100">Volatility 100</option>
                </optgroup>
            </select>
        </div>

        <div class="price-section">
            <div class="price-label">Current Price</div>
            <div class="price-value" id="priceDisplay">
                <span id="priceInt">--</span><span class="decimal" id="priceDec">--</span>
            </div>
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <div class="loading-text">🔮 Analyzing market patterns...</div>
            <div class="loading-timer" id="loadingTimer">--</div>
        </div>

        <div class="predict-center">
            <button class="predict-btn" id="predictBtn">
                🎯 PREDICT
                <span class="sub">Get the next digit prediction</span>
            </button>
        </div>

        <div class="countdown-container" id="countdownContainer">
            <div class="countdown-label">
                <span>⏳ Prediction Valid For</span>
                <span class="time-left" id="timeLeft">15s</span>
            </div>
            <div class="countdown-bar-track">
                <div class="countdown-bar-fill glow-green" id="countdownFill"></div>
            </div>
        </div>

        <div class="result-section">
            <div class="result-item">
                <div class="label">Predicted</div>
                <div class="value predicted" id="predictedDisplay">-</div>
            </div>
            <div class="result-item">
                <div class="label">Confidence</div>
                <div class="value confidence" id="confidenceDisplay">-</div>
            </div>
            <div class="result-item">
                <div class="label">Status</div>
                <div class="value status-text" id="statusDisplay">Waiting</div>
            </div>
        </div>

        <div class="result-status waiting" id="resultStatus">⚡ Click PREDICT to get a digit prediction</div>

        <div class="history-section">
            <div class="history-label">📜 Recent Digits</div>
            <div class="history-digits" id="historyContainer">
                <span style="color:var(--text-muted);font-size:11px;">Waiting for data...</span>
            </div>
        </div>

        <div class="frequency-section">
            <div class="frequency-title">📊 Digit Frequency</div>
            <div class="frequency-grid" id="freqGrid"></div>
        </div>

        <div class="log-section" id="logContainer">
            <div class="log-entry info">🚀 System initializing...</div>
        </div>

    </div>

    <script>
        // ================================================================
        // CONFIGURATION
        // ================================================================

        const APP_ID = 1089;
        const PREDICTION_WINDOW = 15;
        const MIN_TICKS = 3;

        // ================================================================
        // DOM REFS
        // ================================================================

        const DOM = {
            priceInt: document.getElementById('priceInt'),
            priceDec: document.getElementById('priceDec'),
            tickCount: document.getElementById('tickCount'),
            accDisplay: document.getElementById('accDisplay'),
            historyContainer: document.getElementById('historyContainer'),
            freqGrid: document.getElementById('freqGrid'),
            logContainer: document.getElementById('logContainer'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            symbolSelect: document.getElementById('symbol'),
            predictBtn: document.getElementById('predictBtn'),
            predictedDisplay: document.getElementById('predictedDisplay'),
            confidenceDisplay: document.getElementById('confidenceDisplay'),
            statusDisplay: document.getElementById('statusDisplay'),
            resultStatus: document.getElementById('resultStatus'),
            countdownContainer: document.getElementById('countdownContainer'),
            countdownFill: document.getElementById('countdownFill'),
            timeLeft: document.getElementById('timeLeft'),
            loadingSpinner: document.getElementById('loadingSpinner'),
            loadingTimer: document.getElementById('loadingTimer'),
        };

        // ================================================================
        // LOGGER
        // ================================================================

        class Logger {
            constructor(container) {
                this.container = container;
                this.maxEntries = 50;
            }

            log(msg, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                const time = new Date().toLocaleTimeString();
                entry.textContent = `[${time}] ${msg}`;
                this.container.appendChild(entry);
                this.container.scrollTop = this.container.scrollHeight;
                if (this.container.children.length > this.maxEntries) {
                    this.container.removeChild(this.container.firstChild);
                }
                console.log(`[${type}] ${msg}`);
            }
        }

        // ================================================================
        // HISTORY MANAGER
        // ================================================================

        class HistoryManager {
            constructor(container, maxDigits = 50) {
                this.container = container;
                this.maxDigits = maxDigits;
                this.digits = [];
                this.lastDigit = null;
            }

            add(digit) {
                this.digits.push(digit);
                if (this.digits.length > this.maxDigits) {
                    this.digits.shift();
                }
                this.lastDigit = digit;
                this.render();
            }

            render() {
                if (this.digits.length === 0) {
                    this.container.innerHTML =
                        '<span style="color:var(--text-muted);font-size:11px;">Waiting for data...</span>';
                    return;
                }
                const digits = this.digits.slice(-20);
                const html = digits.map((d, i) => {
                    const isRecent = i >= digits.length - 5;
                    const isHighlight = d === this.lastDigit;
                    return `<span class="history-digit ${isRecent ? 'recent' : ''} ${isHighlight ? 'highlight' : ''}">${d}</span>`;
                }).join('');
                this.container.innerHTML = html;
            }

            clear() {
                this.digits = [];
                this.lastDigit = null;
                this.render();
            }

            getHistory() {
                return this.digits;
            }

            get length() {
                return this.digits.length;
            }

            getLastDigits(n) {
                const len = this.digits.length;
                if (len === 0) return [];
                const start = Math.max(0, len - n);
                return this.digits.slice(start);
            }
        }

        // ================================================================
        // FREQUENCY MANAGER
        // ================================================================

        class FrequencyManager {
            constructor(container) {
                this.container = container;
                this.freq = {};
                this.maxFreq = 1;
            }

            update(history) {
                this.freq = {};
                history.forEach(d => {
                    this.freq[d] = (this.freq[d] || 0) + 1;
                });
                this.maxFreq = Math.max(...Object.values(this.freq), 1);
                this.render();
            }

            render() {
                if (Object.keys(this.freq).length === 0) {
                    this.container.innerHTML = '';
                    for (let i = 0; i < 10; i++) {
                        this.container.innerHTML += `
                            <div class="freq-bar-wrapper">
                                <div class="freq-bar"><div class="fill" style="height:0%"></div></div>
                                <div class="freq-label">${i}</div>
                            </div>`;
                    }
                    return;
                }

                let html = '';
                for (let i = 0; i < 10; i++) {
                    const count = this.freq[i] || 0;
                    const pct = (count / this.maxFreq) * 100;
                    const isHigh = pct > 50;
                    html += `
                        <div class="freq-bar-wrapper">
                            <div class="freq-bar">
                                <div class="fill ${isHigh ? 'high' : ''}" style="height:${pct}%"></div>
                            </div>
                            <div class="freq-label">${i}</div>
                        </div>`;
                }
                this.container.innerHTML = html;
            }

            clear() {
                this.freq = {};
                this.maxFreq = 1;
                this.render();
            }
        }

        // ================================================================
        // COUNTDOWN MANAGER
        // ================================================================

        class CountdownManager {
            constructor(container, fill, timeLeft, duration = PREDICTION_WINDOW) {
                this.container = container;
                this.fill = fill;
                this.timeLeft = timeLeft;
                this.duration = duration;
                this.timer = null;
                this.value = duration;
                this.isActive = false;
                this.onExpired = null;
            }

            start() {
                this.container.classList.add('active');
                this.value = this.duration;
                this.isActive = true;
                this._updateUI();

                if (this.timer) clearInterval(this.timer);

                this.timer = setInterval(() => {
                    this.value--;
                    this._updateUI();

                    if (this.value <= 0) {
                        clearInterval(this.timer);
                        this.timer = null;
                        this.isActive = false;
                        this.timeLeft.textContent = '⏰ Expired!';
                        this.fill.className = 'countdown-bar-fill glow-red';
                        if (this.onExpired) this.onExpired();
                    }
                }, 1000);
            }

            _updateUI() {
                const pct = (this.value / this.duration) * 100;
                this.fill.style.width = pct + '%';
                this.timeLeft.textContent = this.value + 's';

                this.fill.className = 'countdown-bar-fill';
                if (this.value > 10) {
                    this.fill.classList.add('glow-green');
                    this.timeLeft.className = 'time-left';
                } else if (this.value > 5) {
                    this.fill.classList.add('glow-yellow');
                    this.timeLeft.className = 'time-left warning';
                } else if (this.value > 2) {
                    this.fill.classList.add('glow-orange');
                    this.timeLeft.className = 'time-left warning';
                } else {
                    this.fill.classList.add('glow-red');
                    this.timeLeft.className = 'time-left danger';
                }
            }

            stop() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
                this.isActive = false;
                this.container.classList.remove('active');
                this.fill.style.width = '100%';
                this.fill.className = 'countdown-bar-fill glow-green';
                this.timeLeft.textContent = this.duration + 's';
                this.timeLeft.className = 'time-left';
                this.value = this.duration;
            }

            reset() {
                this.stop();
            }

            setExpiredCallback(fn) {
                this.onExpired = fn;
            }
        }

        // ================================================================
        // PREDICTION ENGINE
        // ================================================================

        class PredictionEngine {
            constructor() {
                this.history = [];
                this.totalTicks = 0;
                this.correctPredictions = 0;
                this.currentPrediction = null;
                this.isPredictionActive = false;
                this.predictionExpired = false;
                this.lastPrediction = null;
            }

            addTick(digit) {
                this.history.push(digit);
                if (this.history.length > 100) this.history.shift();
                this.totalTicks++;

                // Check if we have a pending prediction
                if (this.isPredictionActive && !this.predictionExpired && this.currentPrediction !== null) {
                    const isMatch = digit === this.currentPrediction;
                    if (isMatch) {
                        this.correctPredictions++;
                        this.isPredictionActive = false;
                        return { result: 'correct', predicted: this.currentPrediction, actual: digit };
                    } else {
                        this.isPredictionActive = false;
                        return { result: 'wrong', predicted: this.currentPrediction, actual: digit };
                    }
                }
                return null;
            }

            generatePrediction() {
                const len = this.history.length;

                // If we have history, use frequency analysis
                if (len > 0) {
                    const freq = {};
                    this.history.forEach(d => freq[d] = (freq[d] || 0) + 1);

                    let maxFreq = 0,
                        pred = 0;
                    for (const [digit, count] of Object.entries(freq)) {
                        if (count > maxFreq) { maxFreq = count;
                            pred = parseInt(digit); }
                    }

                    // Calculate confidence based on frequency dominance
                    const total = this.history.length;
                    const pct = (maxFreq / total) * 100;
                    let confidence = 30 + (pct - 10) * 2;
                    confidence = Math.max(10, Math.min(92, confidence));

                    return { prediction: pred, confidence: confidence };
                }

                // Fallback: random prediction
                return { prediction: Math.floor(Math.random() * 10), confidence: 25 + Math.random() * 20 };
            }

            startPrediction(digit) {
                this.currentPrediction = digit;
                this.isPredictionActive = true;
                this.predictionExpired = false;
                this.lastPrediction = digit;
            }

            expirePrediction() {
                this.predictionExpired = true;
                this.isPredictionActive = false;
                this.currentPrediction = null;
            }

            resetPrediction() {
                this.currentPrediction = null;
                this.isPredictionActive = false;
                this.predictionExpired = false;
            }

            getAccuracy() {
                return this.totalTicks > 0 ? Math.round((this.correctPredictions / this.totalTicks) * 100) : 0;
            }

            getHistory() {
                return this.history;
            }

            getTotalTicks() {
                return this.totalTicks;
            }

            getCurrentPrediction() {
                return this.currentPrediction;
            }

            isActive() {
                return this.isPredictionActive;
            }

            isExpired() {
                return this.predictionExpired;
            }
        }

        // ================================================================
        // DERIV WEBSOCKET
        // ================================================================

        class DerivSocket {
            constructor(appId, onTick, onStatus, onLog) {
                this.appId = appId;
                this.onTick = onTick;
                this.onStatus = onStatus;
                this.onLog = onLog;
                this.ws = null;
                this.isConnected = false;
                this.isConnecting = false;
                this.reconnectAttempts = 0;
                this.maxReconnectDelay = 30000;
                this.reconnectDelay = 1000;
                this.currentSymbol = '1HZ100V';
                this.isSubscribed = false;
                this.isClosing = false;
                this.reconnectTimer = null;
            }

            connect() {
                if (this.isConnected || this.isConnecting) return;
                this.isConnecting = true;
                this.isClosing = false;
                this._setStatus('connecting', '⏳ Connecting...');
                this.onLog('Connecting to Deriv...', 'info');

                const url = `wss://ws.binaryws.com/websockets/v3?app_id=${this.appId}`;

                try {
                    this.ws = new WebSocket(url);
                    this.ws.onopen = this._onOpen.bind(this);
                    this.ws.onmessage = this._onMessage.bind(this);
                    this.ws.onclose = this._onClose.bind(this);
                    this.ws.onerror = this._onError.bind(this);

                    setTimeout(() => {
                        if (this.isConnecting && !this.isConnected) {
                            this.onLog('Connection timeout - retrying...', 'error');
                            this.ws.close();
                        }
                    }, 10000);

                } catch (err) {
                    this.onLog(`Connection error: ${err.message}`, 'error');
                    this.isConnecting = false;
                    this._scheduleReconnect();
                }
            }

            _onOpen() {
                this.isConnected = true;
                this.isConnecting = false;
                this.reconnectAttempts = 0;
                this.reconnectDelay = 1000;
                this._setStatus('online', '✅ Connected');
                this.onLog('Connected successfully', 'success');

                setTimeout(() => {
                    this._subscribe(this.currentSymbol);
                }, 500);
            }

            _onMessage(event) {
                try {
                    const data = JSON.parse(event.data);

                    if (data.msg_type === 'tick' && data.tick) {
                        this.onTick(data.tick);
                    }

                    if (data.msg_type === 'subscription') {
                        this.isSubscribed = true;
                        this.onLog(`✅ Subscribed to ${this.currentSymbol}`, 'success');
                    }

                    if (data.msg_type === 'error') {
                        const msg = data.error?.message || 'Unknown error';
                        this.onLog(`❌ API Error: ${msg}`, 'error');
                    }

                    if (data.msg_type === 'ping') {
                        this.ws.send(JSON.stringify({ pong: data.ping }));
                    }

                } catch (err) {
                    this.onLog(`Parse error: ${err.message}`, 'error');
                }
            }

            _onClose(event) {
                this.isConnected = false;
                this.isConnecting = false;
                this.isSubscribed = false;
                this._setStatus('offline', '🔌 Disconnected');
                this.onLog(`Disconnected (code: ${event.code})`, 'error');

                if (!this.isClosing) {
                    this._scheduleReconnect();
                }
            }

            _onError(error) {
                this.onLog(`WebSocket error: ${error.message || 'Unknown'}`, 'error');
                this._setStatus('offline', '⚠️ Error');
            }

            _scheduleReconnect() {
                if (this.isClosing) return;
                this.reconnectAttempts++;
                const delay = Math.min(this.reconnectDelay, this.maxReconnectDelay);
                this.onLog(`Reconnecting in ${delay/1000}s... (attempt ${this.reconnectAttempts})`, 'info');

                if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
                this.reconnectTimer = setTimeout(() => {
                    if (!this.isConnected && !this.isClosing) {
                        this.connect();
                    }
                }, delay);
                this.reconnectDelay = Math.min(this.reconnectDelay * 1.5, this.maxReconnectDelay);
            }

            _subscribe(symbol) {
                if (!this.isConnected || !this.ws) {
                    this.onLog(`⚠️ Cannot subscribe: not connected`, 'error');
                    return;
                }

                const msg = {
                    ticks: symbol,
                    subscribe: 1
                };
                this.ws.send(JSON.stringify(msg));
                this.currentSymbol = symbol;
                this.onLog(`📤 Subscribing to ${symbol}...`, 'info');
            }

            subscribe(symbol) {
                if (symbol === this.currentSymbol && this.isSubscribed) return;
                this.currentSymbol = symbol;
                if (this.isConnected) {
                    this._subscribe(symbol);
                }
            }

            disconnect() {
                this.isClosing = true;
                if (this.reconnectTimer) {
                    clearTimeout(this.reconnectTimer);
                    this.reconnectTimer = null;
                }
                if (this.ws) {
                    this.ws.close();
                }
                this.isConnected = false;
                this.isConnecting = false;
                this._setStatus('offline', '🔌 Disconnected');
                this.onLog('Disconnected manually', 'info');
            }

            _setStatus(state, text) {
                if (this.onStatus) this.onStatus(state, text);
            }

            isActive() {
                return this.isConnected;
            }
        }

        // ================================================================
        // APP
        // ================================================================

        class App {
            constructor() {
                this.logger = new Logger(DOM.logContainer);
                this.historyManager = new HistoryManager(DOM.historyContainer);
                this.frequencyManager = new FrequencyManager(DOM.freqGrid);
                this.predictionEngine = new PredictionEngine();
                this.countdown = new CountdownManager(
                    DOM.countdownContainer,
                    DOM.countdownFill,
                    DOM.timeLeft,
                    PREDICTION_WINDOW
                );

                this.socket = null;
                this.initialized = false;
                this.isLoading = false;
                this.loadingInterval = null;

                this._bindUI();
                this._init();
            }

            _init() {
                if (this.initialized) return;
                this.initialized = true;

                this.logger.log('🚀 Deriv Predictor initializing...', 'info');

                this.socket = new DerivSocket(
                    APP_ID,
                    this._handleTick.bind(this),
                    this._handleStatus.bind(this),
                    this.logger.log.bind(this.logger)
                );

                this.socket.connect();

                this.countdown.setExpiredCallback(() => {
                    this.predictionEngine.expirePrediction();
                    DOM.statusDisplay.textContent = '⏰ Expired';
                    DOM.statusDisplay.style.color = '#e94560';
                    DOM.resultStatus.textContent = '⏰ Prediction expired! Click PREDICT for a new one.';
                    DOM.resultStatus.className = 'result-status expired';
                    DOM.predictBtn.disabled = false;
                    this.logger.log('⏰ Prediction window expired!', 'error');
                    setTimeout(() => {
                        this.countdown.stop();
                        DOM.resultStatus.textContent = '⚡ Click PREDICT to get a digit prediction';
                        DOM.resultStatus.className = 'result-status waiting';
                    }, 3000);
                });

                this.logger.log('✅ Ready', 'success');
            }

            _handleTick(tick) {
                const price = tick.quote;
                const digit = String(price).slice(-1);

                const [intPart, decPart] = price.toFixed(3).split('.');
                DOM.priceInt.textContent = intPart;
                DOM.priceDec.textContent = '.' + decPart;

                this.historyManager.add(parseInt(digit));
                this.frequencyManager.update(this.historyManager.getHistory());

                // Check if prediction matches
                const result = this.predictionEngine.addTick(parseInt(digit));

                if (result) {
                    this.countdown.stop();
                    DOM.actualDisplay = document.getElementById('actualDisplay');
                    if (!DOM.actualDisplay) {
                        // Create actual display if it doesn't exist
                        const resultSection = document.querySelector('.result-section');
                        const items = resultSection.querySelectorAll('.result-item');
                        if (items.length === 3) {
                            const newItem = document.createElement('div');
                            newItem.className = 'result-item';
                            newItem.innerHTML = `
                                <div class="label">Actual</div>
                                <div class="value" id="actualDisplay" style="color:#22d3ee;font-size:30px;font-weight:800;">-</div>
                            `;
                            resultSection.appendChild(newItem);
                            DOM.actualDisplay = document.getElementById('actualDisplay');
                            // Adjust grid
                            resultSection.style.gridTemplateColumns = '1fr 1fr 1fr 1fr';
                        }
                    }
                    if (DOM.actualDisplay) DOM.actualDisplay.textContent = result.actual;

                    if (result.result === 'correct') {
                        DOM.statusDisplay.textContent = '✅ Correct!';
                        DOM.statusDisplay.style.color = '#22d3ee';
                        DOM.resultStatus.textContent = `✅ CORRECT! Digit ${result.predicted} was right!`;
                        DOM.resultStatus.className = 'result-status correct';
                        DOM.countdownFill.className = 'countdown-bar-fill glow-green';
                        DOM.timeLeft.textContent = '✅ Hit!';
                        this.logger.log(`✅ Correct! Predicted ${result.predicted} → Actual ${result.actual}`, 'success');
                    } else {
                        DOM.statusDisplay.textContent = '❌ Missed';
                        DOM.statusDisplay.style.color = '#e94560';
                        DOM.resultStatus.textContent = `❌ Missed! Was ${result.actual}, not ${result.predicted}`;
                        DOM.resultStatus.className = 'result-status wrong';
                        DOM.countdownFill.className = 'countdown-bar-fill glow-red';
                        DOM.timeLeft.textContent = '❌ Miss!';
                        this.logger.log(`❌ Wrong! Predicted ${result.predicted} → Actual ${result.actual}`, 'error');
                    }

                    DOM.predictBtn.disabled = false;
                    this.predictionEngine.resetPrediction();

                    setTimeout(() => {
                        this.countdown.stop();
                        DOM.resultStatus.textContent = '⚡ Click PREDICT to get a digit prediction';
                        DOM.resultStatus.className = 'result-status waiting';
                    }, 3000);
                }

                DOM.tickCount.textContent = this.predictionEngine.getTotalTicks();
                DOM.accDisplay.textContent = this.predictionEngine.getAccuracy() + '%';

                if (this.predictionEngine.getTotalTicks() % 5 === 0) {
                    this.logger.log(`✅ Tick #${this.predictionEngine.getTotalTicks()}: ${price} → digit ${digit}`, 'success');
                }
            }

            _handleStatus(state, text) {
                DOM.statusDot.className = `dot ${state}`;
                DOM.statusText.textContent = text;
            }

            _startLoading() {
                this.isLoading = true;
                DOM.loadingSpinner.classList.add('active');
                DOM.predictBtn.disabled = true;
                DOM.resultStatus.textContent = '⏳ Analyzing...';
                DOM.resultStatus.className = 'result-status loading';
                DOM.statusDisplay.textContent = '⏳ Loading';
                DOM.statusDisplay.style.color = '#f59e0b';

                const waitTime = 3000 + Math.random() * 8000;
                const startTime = Date.now();

                this.loadingInterval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const remaining = Math.max(0, (waitTime - elapsed) / 1000);
                    DOM.loadingTimer.textContent = `${Math.ceil(remaining)}s`;
                }, 100);

                this.logger.log(`⏳ Analyzing market patterns... (${Math.round(waitTime/1000)}s)`, 'info');

                setTimeout(() => {
                    this._showPrediction();
                }, waitTime);
            }

            _showPrediction() {
                this.isLoading = false;
                clearInterval(this.loadingInterval);
                DOM.loadingSpinner.classList.remove('active');
                DOM.predictBtn.disabled = false;

                const result = this.predictionEngine.generatePrediction();
                const pred = result.prediction;
                const conf = result.confidence;

                DOM.predictedDisplay.textContent = pred;
                DOM.confidenceDisplay.textContent = Math.round(conf) + '%';
                DOM.statusDisplay.textContent = '⏳ Active';
                DOM.statusDisplay.style.color = '#22d3ee';
                DOM.resultStatus.textContent = `🎯 ${pred} predicted! Valid for ${PREDICTION_WINDOW}s`;
                DOM.resultStatus.className = 'result-status active';

                // Reset actual display if exists
                if (DOM.actualDisplay) DOM.actualDisplay.textContent = '...';

                this.predictionEngine.startPrediction(pred);
                this.countdown.start();

                this.logger.log(`🎯 PREDICTED: ${pred} (${Math.round(conf)}% confidence)`, 'info');
                this.logger.log(`⏳ You have ${PREDICTION_WINDOW}s to trade this digit`, 'info');
            }

            _bindUI() {
                DOM.predictBtn.addEventListener('click', () => {
                    if (this.isLoading) {
                        DOM.resultStatus.textContent = '⏳ Already analyzing...';
                        DOM.resultStatus.className = 'result-status loading';
                        return;
                    }

                    if (this.predictionEngine.isActive() && !this.predictionEngine.isExpired()) {
                        DOM.resultStatus.textContent = '⏳ Prediction already active!';
                        DOM.resultStatus.className = 'result-status waiting';
                        return;
                    }

                    if (this.predictionEngine.getTotalTicks() < MIN_TICKS) {
                        DOM.resultStatus.textContent = `⏳ Need ${MIN_TICKS}+ ticks... (${this.predictionEngine.getTotalTicks()}/${MIN_TICKS})`;
                        DOM.resultStatus.className = 'result-status waiting';
                        this.logger.log(`⏳ Not enough data (${this.predictionEngine.getTotalTicks()}/${MIN_TICKS})`, 'info');
                        return;
                    }

                    DOM.predictedDisplay.textContent = '-';
                    DOM.confidenceDisplay.textContent = '-';
                    DOM.statusDisplay.textContent = '⏳ Loading';
                    DOM.statusDisplay.style.color = '#f59e0b';
                    DOM.resultStatus.textContent = '⏳ Analyzing market patterns...';
                    DOM.resultStatus.className = 'result-status loading';

                    if (DOM.actualDisplay) DOM.actualDisplay.textContent = '-';

                    this._startLoading();
                });

                DOM.symbolSelect.addEventListener('change', () => {
                    if (this.countdown.timer) {
                        clearInterval(this.countdown.timer);
                        this.countdown.timer = null;
                    }
                    if (this.loadingInterval) {
                        clearInterval(this.loadingInterval);
                        this.loadingInterval = null;
                    }
                    this.countdown.stop();
                    this.predictionEngine.resetPrediction();
                    this.predictionEngine.expired = false;
                    DOM.predictBtn.disabled = false;
                    this.isLoading = false;
                    DOM.loadingSpinner.classList.remove('active');

                    const symbol = DOM.symbolSelect.value;
                    DOM.predictedDisplay.textContent = '-';
                    DOM.confidenceDisplay.textContent = '-';
                    DOM.statusDisplay.textContent = 'Waiting';
                    DOM.statusDisplay.style.color = '#f59e0b';
                    DOM.priceInt.textContent = '--';
                    DOM.priceDec.textContent = '--';
                    DOM.tickCount.textContent = '0';
                    DOM.accDisplay.textContent = '0%';
                    DOM.resultStatus.textContent = '⚡ Click PREDICT to get a digit prediction';
                    DOM.resultStatus.className = 'result-status waiting';
                    if (DOM.actualDisplay) DOM.actualDisplay.textContent = '-';

                    this.predictionEngine.history = [];
                    this.predictionEngine.totalTicks = 0;
                    this.predictionEngine.correctPredictions = 0;
                    this.historyManager.clear();
                    this.frequencyManager.clear();

                    this.logger.log(`🔄 Switched to ${symbol}`, 'info');
                    this.socket.subscribe(symbol);
                });
            }
        }

        // ================================================================
        // START
        // ================================================================

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.app = new App();
            });
        } else {
            window.app = new App();
        }
    </script>

</body>
</html>

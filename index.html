<script>
    // ================================================================
    // CONFIGURATION - REST API with CORS Proxy
    // ================================================================

    const APP_ID = 1089;
    const CALIBRATION_TICKS = 10;
    const POLL_INTERVAL = 2000;

    // ✅ WORKING CORS PROXY
    const CORS_PROXY = 'https://corsproxy.io/?';

    // ================================================================
    // SOUND ALERT
    // ================================================================

    function playSignalSound() {
        try {
            const audioContext = new(window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(1100, audioContext.currentTime + 0.15);
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.frequency.setValueAtTime(1100, audioContext.currentTime);
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.25, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.3);
            }, 200);
            console.log('🔊 Signal sound played!');
        } catch (e) {
            console.log('Sound not supported:', e);
        }
    }

    // ================================================================
    // DOM REFS
    // ================================================================

    const DOM = {
        priceInt: document.getElementById('priceInt'),
        priceDec: document.getElementById('priceDec'),
        tickCount: document.getElementById('tickCount'),
        accDisplay: document.getElementById('accDisplay'),
        historyContainer: document.getElementById('historyContainer'),
        logContainer: document.getElementById('logContainer'),
        statusDot: document.getElementById('statusDot'),
        statusText: document.getElementById('statusText'),
        symbolSelect: document.getElementById('symbol'),
        digitSelector: document.getElementById('digitSelector'),
        calibrationStatus: document.getElementById('calibrationStatus'),
        calibrationText: document.getElementById('calibrationText'),
        calibrationCount: document.getElementById('calibrationCount'),
        calibrationProgress: document.getElementById('calibrationProgress'),
        freqPrediction: document.getElementById('freqPrediction'),
        freqConfidence: document.getElementById('freqConfidence'),
        freqHits: document.getElementById('freqHits'),
        recencyPrediction: document.getElementById('recencyPrediction'),
        recencyConfidence: document.getElementById('recencyConfidence'),
        recencyStreak: document.getElementById('recencyStreak'),
        consensusDigit: document.getElementById('consensusDigit'),
        signalStrength: document.getElementById('signalStrength'),
        entrySignal: document.getElementById('entrySignal'),
        consensusConfidenceFill: document.getElementById('consensusConfidenceFill'),
        consensusConfidenceText: document.getElementById('consensusConfidenceText'),
        frequencyModule: document.getElementById('frequencyModule'),
        recencyModule: document.getElementById('recencyModule'),
        topCandidate: document.getElementById('topCandidate'),
        signalAlert: document.getElementById('signalAlert'),
        signalDigit: document.getElementById('signalDigit'),
    };

    // ================================================================
    // STATE
    // ================================================================

    let state = {
        ticks: [],
        isCalibrated: false,
        totalTicks: 0,
        correctPredictions: 0,
        currentSymbol: '1HZ100V',
        frequencyPrediction: null,
        recencyPrediction: null,
        frequencyConfidence: 0,
        recencyConfidence: 0,
        freqHits: 0,
        recencyStreak: 0,
        consensusDigit: null,
        consensusConfidence: 0,
        signalStrength: null,
        entrySignal: null,
        historyDigits: [],
        signalActive: false,
        tickCount: 0,
        pollInterval: null,
    };

    // ================================================================
    // LOGGER
    // ================================================================

    const logger = {
        container: DOM.logContainer,
        maxEntries: 50,

        log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            this.container.appendChild(entry);
            this.container.scrollTop = this.container.scrollHeight;
            if (this.container.children.length > this.maxEntries) {
                this.container.removeChild(this.container.firstChild);
            }
            console.log(`[${type}] ${msg}`);
        }
    };

    // ================================================================
    // UTILITY FUNCTIONS
    // ================================================================

    function setStatus(state, text) {
        DOM.statusDot.className = `dot ${state}`;
        DOM.statusText.textContent = text;
    }

    function getDigit(price) {
        return parseInt(String(price).slice(-1));
    }

    function getMostFrequent(arr) {
        if (arr.length === 0) return null;
        const freq = {};
        arr.forEach(d => freq[d] = (freq[d] || 0) + 1);
        let maxFreq = 0,
            pred = 0;
        for (const [digit, count] of Object.entries(freq)) {
            if (count > maxFreq) { maxFreq = count;
                pred = parseInt(digit); }
        }
        return { digit: pred, count: maxFreq, total: arr.length, freq };
    }

    function getRecencyPrediction(ticks) {
        if (ticks.length < 2) return null;
        const len = ticks.length;
        const last = ticks[len - 1];
        const prev = ticks[len - 2];

        let streak = 0;
        for (let i = len - 1; i > 0; i--) {
            if (ticks[i] === ticks[i - 1]) streak++;
            else break;
        }

        let pattern = null;
        if (len >= 3) {
            const d1 = ticks[len - 3];
            const d2 = ticks[len - 2];
            const d3 = ticks[len - 1];
            if (d1 === d3 && d1 !== d2) {
                pattern = { outer: d1, middle: d2, pattern: [d1, d2, d3] };
            }
        }

        let prediction = null;
        let confidence = 0;

        if (pattern) {
            prediction = pattern.middle;
            confidence = 65 + Math.random() * 15;
        } else if (streak >= 2) {
            prediction = last;
            confidence = 55 + Math.random() * 20;
        } else {
            const recent = ticks.slice(-5);
            const freq = {};
            recent.forEach(d => freq[d] = (freq[d] || 0) + 1);
            let maxFreq = 0,
                pred = 0;
            for (const [digit, count] of Object.entries(freq)) {
                if (count > maxFreq) { maxFreq = count;
                    pred = parseInt(digit); }
            }
            prediction = pred;
            confidence = 40 + Math.random() * 25;
        }

        return { prediction, confidence, streak, pattern };
    }

    // ================================================================
    // REST API FETCH with CORS Proxy
    // ================================================================

    function fetchTick() {
        const symbol = DOM.symbolSelect.value;
        const targetUrl = `https://api.deriv.com/v3/ticks?ticks=${symbol}&app_id=${APP_ID}`;
        const proxyUrl = CORS_PROXY + encodeURIComponent(targetUrl);

        console.log('📡 Fetching via proxy:', proxyUrl);

        fetch(proxyUrl, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                console.log('📊 Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('📩 Data received:', data);
                if (data.tick) {
                    handleTick(data.tick);
                } else if (data.error) {
                    logger.log(`❌ API Error: ${data.error.message}`, 'error');
                }
            })
            .catch(err => {
                console.log('❌ Fetch failed:', err.message);
                // Retry after a moment
                setTimeout(() => {
                    if (state.pollInterval) {
                        fetchTick();
                    }
                }, 3000);
            });
    }

    // ================================================================
    // HANDLE TICK
    // ================================================================

    function handleTick(tick) {
        const price = tick.quote;
        const digit = getDigit(price);

        // Update price
        const [intPart, decPart] = price.toFixed(3).split('.');
        DOM.priceInt.textContent = intPart;
        DOM.priceDec.textContent = '.' + decPart;

        // Update history
        state.historyDigits.push(digit);
        if (state.historyDigits.length > 20) {
            state.historyDigits.shift();
        }
        renderHistory();

        // Store tick for calibration
        state.ticks.push(digit);
        state.tickCount++;
        const count = state.ticks.length;

        // Update calibration progress
        const pct = Math.min(100, (count / CALIBRATION_TICKS) * 100);
        DOM.calibrationProgress.style.width = pct + '%';
        DOM.calibrationCount.textContent = count;

        if (count <= 5 || count % 5 === 0) {
            logger.log(`📥 Tick #${state.tickCount}: ${price} → digit ${digit} (${count}/${CALIBRATION_TICKS})`, 'info');
        }

        // Calibration complete
        if (count >= CALIBRATION_TICKS && !state.isCalibrated) {
            state.isCalibrated = true;
            DOM.calibrationStatus.classList.add('done');
            DOM.calibrationText.innerHTML = '✅ Calibration complete! <span class="checkmark">✓</span>';
            DOM.calibrationProgress.style.width = '100%';

            document.querySelectorAll('.digit-btn').forEach(b => b.disabled = false);

            analyzeAndPredict();
            logger.log('✅ Calibration complete! 10 ticks collected', 'success');
            DOM.tickCount.textContent = state.tickCount;
        }

        DOM.tickCount.textContent = state.tickCount;

        if (state.isCalibrated) {
            analyzeAndPredict();
        }
    }

    // ================================================================
    // ANALYZE & PREDICT
    // ================================================================

    function analyzeAndPredict() {
        const ticks = state.ticks;

        const freqResult = getMostFrequent(ticks);
        if (freqResult) {
            state.frequencyPrediction = freqResult.digit;
            state.freqHits = freqResult.count;
            state.frequencyConfidence = Math.min(92, 50 + (freqResult.count / freqResult.total) * 40);

            DOM.freqPrediction.textContent = freqResult.digit;
            DOM.freqHits.textContent = freqResult.count;
            const conf = Math.round(state.frequencyConfidence);
            DOM.freqConfidence.textContent = conf + '%';
            DOM.freqConfidence.className = 'confidence-text ' + (conf > 70 ? 'high' : conf > 50 ? 'medium' : 'low');
            DOM.frequencyModule.classList.add('visible');
        }

        const recencyResult = getRecencyPrediction(ticks);
        if (recencyResult) {
            state.recencyPrediction = recencyResult.prediction;
            state.recencyStreak = recencyResult.streak || 0;
            state.recencyConfidence = recencyResult.confidence;

            DOM.recencyPrediction.textContent = recencyResult.prediction;
            DOM.recencyStreak.textContent = recencyResult.streak || 0;
            const conf = Math.round(recencyResult.confidence);
            DOM.recencyConfidence.textContent = conf + '%';
            DOM.recencyConfidence.className = 'confidence-text ' + (conf > 70 ? 'high' : conf > 50 ? 'medium' : 'low');

            if (recencyResult.pattern) {
                DOM.recencyPrediction.textContent = recencyResult.prediction + ' (X2X)';
            }
            DOM.recencyModule.classList.add('visible');
        }

        updateTopCandidate();
    }

    // ================================================================
    // UPDATE TOP CANDIDATE
    // ================================================================

    function updateTopCandidate() {
        const freqPred = state.frequencyPrediction;
        const recPred = state.recencyPrediction;
        const freqConf = state.frequencyConfidence;
        const recConf = state.recencyConfidence;

        let consensus = null;
        let confidence = 0;
        let strength = null;
        let entry = null;

        document.querySelectorAll('.digit-btn').forEach(b => b.classList.remove('highlight-signal'));

        if (freqPred !== null && recPred !== null) {
            if (freqPred === recPred) {
                consensus = freqPred;
                confidence = Math.max(freqConf, recConf);
                strength = 'STRONG';
                entry = 'YES';

                if (consensus !== null && confidence > 60) {
                    activateSignal(consensus, confidence);
                } else {
                    deactivateSignal();
                }
            } else {
                if (freqConf > recConf && freqConf > 65) {
                    consensus = freqPred;
                    confidence = freqConf;
                    strength = 'WEAK';
                    entry = 'CAUTION';
                } else if (recConf > freqConf && recConf > 65) {
                    consensus = recPred;
                    confidence = recConf;
                    strength = 'WEAK';
                    entry = 'CAUTION';
                } else {
                    consensus = freqPred;
                    confidence = Math.min(freqConf, recConf);
                    strength = 'WEAK';
                    entry = 'NO';
                }
                deactivateSignal();
            }
        } else if (freqPred !== null) {
            consensus = freqPred;
            confidence = freqConf;
            strength = 'WEAK';
            entry = 'CAUTION';
            deactivateSignal();
        } else if (recPred !== null) {
            consensus = recPred;
            confidence = recConf;
            strength = 'WEAK';
            entry = 'CAUTION';
            deactivateSignal();
        } else {
            deactivateSignal();
        }

        state.consensusDigit = consensus;
        state.consensusConfidence = confidence;
        state.signalStrength = strength;
        state.entrySignal = entry;

        if (consensus !== null) {
            DOM.topCandidate.classList.add('visible');
            DOM.consensusDigit.textContent = consensus;

            DOM.signalStrength.textContent = strength;
            DOM.signalStrength.className = 'value ' + (strength === 'STRONG' ? 'strong' : strength === 'WEAK' ? 'weak' : 'no');

            DOM.entrySignal.textContent = entry;
            DOM.entrySignal.className = 'value ' + (entry === 'YES' ? 'yes' : entry === 'CAUTION' ? 'caution' : 'no-entry');

            const confPct = Math.round(confidence);
            DOM.consensusConfidenceFill.style.width = confPct + '%';
            DOM.consensusConfidenceFill.className = 'confidence-bar-fill done';
            DOM.consensusConfidenceText.textContent = confPct + '%';
        } else {
            DOM.topCandidate.classList.remove('visible');
        }
    }

    // ================================================================
    // SIGNAL FUNCTIONS
    // ================================================================

    function activateSignal(digit, confidence) {
        if (state.signalActive && state.consensusDigit === digit) return;

        state.signalActive = true;
        state.consensusDigit = digit;
        state.consensusConfidence = confidence;

        DOM.signalAlert.classList.add('active');
        DOM.signalDigit.textContent = digit;

        document.querySelectorAll('.digit-btn').forEach(btn => {
            btn.classList.remove('highlight-signal');
            if (parseInt(btn.dataset.digit) === digit) {
                btn.classList.add('highlight-signal');
            }
        });

        playSignalSound();
        logger.log(`🚀 SIGNAL! Digit ${digit} confirmed with ${Math.round(confidence)}% confidence`, 'signal');

        state.correctPredictions++;
        updateAccuracy();
    }

    function deactivateSignal() {
        if (!state.signalActive) return;
        state.signalActive = false;
        DOM.signalAlert.classList.remove('active');
        document.querySelectorAll('.digit-btn').forEach(b => b.classList.remove('highlight-signal'));
    }

    // ================================================================
    // RENDER HISTORY
    // ================================================================

    function renderHistory() {
        if (state.historyDigits.length === 0) {
            DOM.historyContainer.innerHTML = '<span style="color:var(--text-muted);font-size:11px;">Waiting for data...</span>';
            return;
        }
        const html = state.historyDigits.map((d, i) => {
            const isRecent = i >= state.historyDigits.length - 5;
            const isHighlight = i === state.historyDigits.length - 1;
            return `<span class="history-digit ${isRecent ? 'recent' : ''} ${isHighlight ? 'highlight' : ''}">${d}</span>`;
        }).join('');
        DOM.historyContainer.innerHTML = html;
    }

    // ================================================================
    // UPDATE ACCURACY
    // ================================================================

    function updateAccuracy() {
        const total = state.tickCount || 1;
        const acc = total > 0 ? Math.round((state.correctPredictions / total) * 100) : 0;
        DOM.accDisplay.textContent = acc + '%';
    }

    // ================================================================
    // RESET CALIBRATION
    // ================================================================

    function resetCalibration() {
        state.ticks = [];
        state.isCalibrated = false;
        state.frequencyPrediction = null;
        state.recencyPrediction = null;
        state.consensusDigit = null;
        state.consensusConfidence = 0;
        state.signalStrength = null;
        state.entrySignal = null;
        state.historyDigits = [];
        state.signalActive = false;
        state.tickCount = 0;

        DOM.calibrationStatus.classList.remove('done');
        DOM.calibrationText.innerHTML = '🔄 Calibrating... <span class="highlight" id="calibrationCount">0</span>/10 ticks';
        DOM.calibrationProgress.style.width = '0%';

        DOM.freqPrediction.innerHTML = '<span class="placeholder">--</span>';
        DOM.freqConfidence.textContent = '--';
        DOM.freqHits.textContent = '0';
        DOM.recencyPrediction.innerHTML = '<span class="placeholder">--</span>';
        DOM.recencyConfidence.textContent = '--';
        DOM.recencyStreak.textContent = '0';

        DOM.consensusDigit.textContent = '--';
        DOM.signalStrength.textContent = '--';
        DOM.signalStrength.className = 'value';
        DOM.entrySignal.textContent = '--';
        DOM.entrySignal.className = 'value';
        DOM.consensusConfidenceFill.style.width = '0%';
        DOM.consensusConfidenceText.textContent = '--';

        DOM.signalAlert.classList.remove('active');
        DOM.signalDigit.textContent = '--';

        DOM.frequencyModule.classList.remove('visible');
        DOM.recencyModule.classList.remove('visible');
        DOM.topCandidate.classList.remove('visible');

        document.querySelectorAll('.digit-btn').forEach(b => {
            b.classList.remove('highlight-signal');
            b.disabled = true;
        });

        state.historyDigits = [];
        renderHistory();

        logger.log('🔄 Calibration started - collecting 10 ticks', 'info');
    }

    // ================================================================
    // START POLLING
    // ================================================================

    function startPolling() {
        setStatus('online', '✅ Connected (REST)');
        logger.log('✅ REST API polling started (every 2s)', 'success');
        logger.log(`📡 Fetching: ${DOM.symbolSelect.value}`, 'info');

        // Fetch immediately
        fetchTick();

        // Then every 2 seconds
        state.pollInterval = setInterval(fetchTick, POLL_INTERVAL);
    }

    // ================================================================
    // INIT
    // ================================================================

    function init() {
        logger.log('🚀 DERIV Matches (REST API) initializing...', 'info');
        logger.log(`📱 App ID: ${APP_ID}`, 'info');
        logger.log(`⏱ Polling every ${POLL_INTERVAL/1000}s`, 'info');
        logger.log(`🔄 CORS Proxy: ${CORS_PROXY}`, 'info');

        resetCalibration();

        // Digit selector
        DOM.digitSelector.querySelectorAll('.digit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!state.isCalibrated) {
                    logger.log('⏳ Calibrating... please wait', 'info');
                    return;
                }
                DOM.digitSelector.querySelectorAll('.digit-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                logger.log(`🎯 Selected digit: ${btn.dataset.digit}`, 'info');
            });
        });

        // Symbol change
        DOM.symbolSelect.addEventListener('change', () => {
            if (state.pollInterval) {
                clearInterval(state.pollInterval);
            }
            resetCalibration();
            logger.log(`🔄 Switched to ${DOM.symbolSelect.value}`, 'info');
            fetchTick();
            state.pollInterval = setInterval(fetchTick, POLL_INTERVAL);
        });

        startPolling();

        logger.log('✅ Ready', 'success');
    }

    // ================================================================
    // START
    // ================================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
